# Install + test on every pull request and push to main. Independent of deploy.yml
# (which is disabled in this repository; self-hosters enable it in their fork).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Install + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --run
      - run: npx tsc -p packages/dns-checks
