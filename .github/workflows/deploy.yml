# Deploys the Cloudflare Worker on every push to main.
#
# Required secrets (set in GitHub repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with Workers Scripts:Edit, D1:Edit, Email Sending:Edit,
#                           Email Routing Rules:Edit, Zone:Read, DNS:Edit, Workers Routes:Edit
#   CLOUDFLARE_ACCOUNT_ID — Your Cloudflare account ID (found in the dashboard sidebar)

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build first, then migrate, then deploy: keeps the window where the old Worker
      # serves against the new schema as short as possible.
      - name: Build dashboard
        run: npm run build:dashboard

      - name: Migrate D1 (idempotent; adopts older installs)
        run: npm run migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
