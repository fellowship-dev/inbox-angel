# Runs the tests on every pull request and push to main; deploys the Cloudflare Worker
# on pushes to main only after the tests pass.
#
# Required secrets (set in GitHub repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with Workers Scripts:Edit, D1:Edit, Email Sending:Edit,
#                           Email Routing Rules:Edit, Zone:Read, DNS:Edit, Workers Routes:Edit
#   CLOUDFLARE_ACCOUNT_ID — Your Cloudflare account ID (found in the dashboard sidebar)

name: Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Install + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --run
      - run: npx tsc -p packages/dns-checks

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
